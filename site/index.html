<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gamma Creative Analytics</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f6f5f8;--panel:#fff;--panel2:#faf9fc;--text:#17141f;--muted:#6b6577;--line:#e7e3ee;
  --accent:#7b3fe4;--accent-soft:#efe7fd;--good:#13865a;--good-soft:#e2f5ec;--bad:#c23b3b;--bad-soft:#fbe6e6;
  --warn:#a86a00;--warn-soft:#fdf1dc;--shadow:0 1px 2px rgba(20,10,40,.05),0 4px 16px rgba(20,10,40,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121017;--panel:#1b1822;--panel2:#211d2a;--text:#ece9f3;--muted:#9a93a8;--line:#2e2938;
  --accent:#a77bff;--accent-soft:#2c2142;--good:#3ccf8e;--good-soft:#173326;--bad:#ff7a7a;--bad-soft:#3a1d1f;
  --warn:#f0b44c;--warn-soft:#3a2c13;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#121017;--panel:#1b1822;--panel2:#211d2a;--text:#ece9f3;--muted:#9a93a8;--line:#2e2938;
  --accent:#a77bff;--accent-soft:#2c2142;--good:#3ccf8e;--good-soft:#173326;--bad:#ff7a7a;--bad-soft:#3a1d1f;
  --warn:#f0b44c;--warn-soft:#3a2c13;--shadow:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.logo{width:34px;height:34px;border-radius:9px;display:block}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.filters{display:flex;flex-wrap:wrap;gap:14px 20px;padding:14px 16px;margin-bottom:14px;align-items:flex-end}
.f label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel2);padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:500;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
select,input[type=date],input[type=search],input[type=password]{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:7px 10px;min-height:34px}
select{max-width:320px}
tr.go{cursor:pointer}
.check{display:flex;align-items:center;gap:6px;font-size:13px;min-height:34px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .c{font-size:12px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tab{padding:12px 14px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.toolbar{display:flex;gap:10px;align-items:center;padding:12px 14px;flex-wrap:wrap}
.tablewrap{overflow:auto;max-height:72vh}
#aud h3{margin:18px 14px 6px;font-size:14px}#aud .sub2{margin:0 14px 8px;color:var(--muted);font-size:12px}
#aud .tablewrap{max-height:none}
#aud .acards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px}#aud .acards .card{padding:14px 16px}
#aud .acards .l{color:var(--muted);font-size:12px;font-weight:600}#aud .acards .v{font-size:20px;font-weight:700;margin:4px 0}#aud .acards .c{color:var(--muted);font-size:12px}
#aud .pyr{display:grid;grid-template-columns:1fr 64px 1fr;gap:6px 0;align-items:center;margin:8px auto 0;max-width:900px}
#aud .pyr .age{text-align:center;font-weight:600;font-size:12px;color:var(--muted)}#aud .side{display:flex;flex-direction:column;gap:3px}#aud .side.l{align-items:flex-end;padding-left:44px}#aud .side.r{padding-right:44px}
#aud .pb{height:11px;border-radius:3px;position:relative}#aud .pb span{position:absolute;top:-2px;font-size:11px;color:var(--muted);white-space:nowrap}
#aud .side.l .pb span{right:calc(100% + 6px)}#aud .side.r .pb span{left:calc(100% + 6px)}
#aud .legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:12px 14px}#aud .legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
#aud .hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-right:14px}
#aud .seg{display:inline-flex;background:var(--line);border-radius:9px;padding:3px}#aud .seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}#aud .seg button.on{background:var(--card,#fff);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#aud table.hm{border-collapse:separate;border-spacing:3px}#aud table.hm td{text-align:center;border-radius:6px;border:0;padding:8px 6px}#aud table.hm td.l{text-align:left;font-weight:600}
#aud table.hm th{text-align:center}#aud table.hm th.l{text-align:left}#aud table.hm tr[data-ae],#aud table.hm tr[data-as]{cursor:pointer}#aud table.hm tr[data-ae]:hover td.l,#aud table.hm tr[data-as]:hover td.l{color:var(--accent)}
#aud td.hg{background:rgba(31,157,107,.16);color:#1f9d6b;font-weight:600}#aud td.hb{background:rgba(209,69,59,.14);color:#d1453b;font-weight:600}#aud td.hn{background:rgba(127,137,170,.10)}
#aud td.thin{background:repeating-linear-gradient(45deg,rgba(127,137,170,.16),rgba(127,137,170,.16) 4px,transparent 4px,transparent 8px);color:var(--muted)}
#aud tr.avg td{color:var(--muted);font-style:italic;background:none}
#aud details{margin:10px 14px 14px}#aud summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}#aud details h3{margin-left:0}#aud details .sub2{margin-left:0}
@media (max-width:700px){#aud .acards{grid-template-columns:1fr}}#aud .bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);opacity:.55;margin-left:6px;vertical-align:middle}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--panel2);text-align:right;font-weight:600;color:var(--muted);font-size:11.5px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
th.l,td.l{text-align:left}
th .arr{opacity:.5}
td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:hover td{background:var(--panel2)}
td.name{min-width:380px;max-width:500px;white-space:normal}
.drv{color:var(--accent,#2563eb);text-decoration:none;font-weight:600}.drv:hover{text-decoration:underline}
.thumb{width:38px;height:52px;border-radius:6px;object-fit:cover;background:var(--line);display:block}
.cr{display:flex;gap:10px;align-items:center}
.cr .t{font-weight:600;max-width:440px;overflow-wrap:break-word}
.cr .s{font-size:11.5px;color:var(--muted);overflow-wrap:break-word}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.g{background:var(--good-soft);color:var(--good)}.pill.b{background:var(--bad-soft);color:var(--bad)}.pill.w{background:var(--warn-soft);color:var(--warn)}.pill.n{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.ed{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.roas-good{color:var(--good);font-weight:600}.roas-bad{color:var(--bad);font-weight:600}
.spark{display:inline-flex;gap:2px;align-items:flex-end;height:22px;vertical-align:middle}
.spark i{width:7px;background:var(--accent);border-radius:2px;opacity:.85}
.muted{color:var(--muted)}
.more{padding:14px;text-align:center}
.lock{min-height:100vh;display:grid;place-items:center;padding:16px}
.lock .card{padding:28px;width:100%;max-width:380px}
.lock h2{margin:12px 0 4px;font-size:20px}
.lock input[type=password]{width:100%;margin:16px 0 10px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.note{font-size:12px;color:var(--muted);padding:0 16px 14px}
#preview{position:fixed;pointer-events:none;z-index:50;display:none;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:240px;max-height:420px}
@media (max-width:640px){.kpi .v{font-size:20px}h1{font-size:17px}}
</style>
</head>
<body>
<div id="lock" class="lock">
  <form class="card" id="lockform">
    <img class="logo" src="icon.svg" alt="">
    <h2>Creative Analytics</h2>
    <div class="sub">Enter the team password to open the dashboard.</div>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
    <label class="check"><input type="checkbox" id="remember" checked> Remember on this device</label>
    <div class="err" id="err"></div>
    <button class="btn primary" style="width:100%;justify-content:center;margin-top:6px">Open</button>
  </form>
</div>

<div id="app" class="wrap" hidden>
  <header>
    <img class="logo" src="icon.svg" alt="">
    <div><h1>Gamma Creative Analytics</h1><div class="sub" id="updated"></div></div>
    <div class="spacer"></div>
    <button class="btn" id="theme" title="Toggle theme">◐</button>
    <button class="btn primary" id="export">⬇ Export to Excel</button>
  </header>

  <section class="card filters">
    <div class="f"><label>Editor</label><div class="chips" id="editors"></div></div>
    <div class="f"><label>Series</label><select id="series"></select></div>
    <div class="f"><label>Period</label><div class="chips" id="presets"></div></div>
    <div class="f"><label>From</label><input type="date" id="from"></div>
    <div class="f"><label>To</label><input type="date" id="to"></div>
    <div class="f"><label>Account</label><select id="account"></select></div>
  </section>

  <section class="kpis" id="kpis"></section>

  <section class="card">
    <div class="tabs" id="tabs"></div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search creative name…" style="flex:1;min-width:180px;max-width:360px">
      <label class="check" id="dimwrap" hidden>Break down by <select id="dim"></select></label>
      <label class="check" id="testedwrap"><input type="checkbox" id="tested" checked> Tested only (spend ≥ $15)</label>
      <label class="check" id="neverwrap" hidden><input type="checkbox" id="never"> Hide ads that never ran</label>
      <span class="spacer"></span><span class="muted" id="count"></span>
    </div>
    <div class="tablewrap" id="tblwrap"><table id="tbl"></table></div>
    <div id="aud" hidden></div>
    <div class="more" id="morewrap" hidden><button class="btn" id="more">Show more</button></div>
    <div class="note" id="note"></div>
  </section>
</div>
<img id="preview" alt="">

<script>
"use strict";
const $ = s => document.querySelector(s);
const PW_KEY = "gca_pw";
let D, AD, ROWS, BL = [], state = {editor:"All", series:"All", account:"All", from:null, to:null, tab:"creatives", q:"", tested:true, hideNever:false, sort:{key:"spend",dir:-1}, limit:150};

// ---------- theme ----------
try { const t = localStorage.getItem("gca_theme"); if (t) document.documentElement.dataset.theme = t; } catch(e){}
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nxt = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nxt; try { localStorage.setItem("gca_theme", nxt); } catch(e){}
};

// ---------- decrypt ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let ENC;
async function unlock(pw){
  if (!ENC) ENC = await (await fetch("data.enc?" + Date.now())).json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.ct));
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}
$("#lockform").onsubmit = async e => {
  e.preventDefault(); $("#err").textContent = "Opening…";
  try {
    const pw = $("#pw").value; D = await unlock(pw);
    try { if ($("#remember").checked) localStorage.setItem(PW_KEY, pw); } catch(e){}
    start();
  } catch(err){ $("#err").textContent = "Wrong password."; }
};
(async () => { let pw = null; try { pw = localStorage.getItem(PW_KEY); } catch(e){}
  if (location.hash.startsWith("#pw=")) { pw = decodeURIComponent(location.hash.slice(4)); history.replaceState(null, "", location.pathname); }
  if (pw) { // saved password: lock the form while it opens, so a typed password is never mistaken for the one that worked
    const fs = [...document.querySelectorAll("#lockform input, #lockform button")]; fs.forEach(x => x.disabled = true); $("#err").textContent = "Opening with the saved password…";
    try { D = await unlock(pw); start(); } catch(e){ console.error('unlock failed', e && (e.stack||e.message||e)); try{localStorage.removeItem(PW_KEY);}catch(_){}
      fs.forEach(x => x.disabled = false); $("#err").textContent = "The saved password no longer works. Enter the team password."; } } })();

// ---------- helpers ----------
const fmt$ = v => v == null || !isFinite(v) ? "–" : "$" + (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("en-US") : v.toFixed(v < 10 ? 2 : 0));
const fmtN = v => v == null || !isFinite(v) ? "–" : Math.round(v).toLocaleString("en-US");
const fmtR = v => v == null || !isFinite(v) ? "–" : v.toFixed(2);
const fmtP = v => v == null || !isFinite(v) ? "–" : v.toFixed(v < 10 ? 2 : 1) + "%";
const fmtS = v => v == null || !isFinite(v) ? "–" : v.toFixed(1) + "s";
const div = (a, b) => b ? a / b : null;
const dayDate = i => { const d = new Date(D.since + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + i); return d; };
const iso = d => d.toISOString().slice(0, 10);
const dayIdx = s => Math.round((new Date(s + "T00:00:00Z") - new Date(D.since + "T00:00:00Z")) / 864e5);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- editors' naming convention (dictionary sheet 10WxSmbwt3jEiQiWc9TFwgDW5jRyZhd7L7Tj66Ltx61s, 26.10) ----------
// SERIES_EDITOR_BATCH_AD_<duration>_<edit>_<inserts>_<graphics>_<cta>_<voiceover>_mx<song>
const NAMING = {
  edit: {TJ:"Time jump (hook + loop)", TSR:"Teaser", TRLR:"Trailer", EP:"Full episode", SC:"Full scene", FAN:"Fan edit"},
  ins: {"0":"None", PROMO:"Promo", BTS:"Behind the scenes", AI:"AI-generated footage", BLOG:"Blogger", STOCK:"Stock footage"},
  gfx: {"0":"None", STORY:"Story", TMR:"Timer", POV:"POV", FLAG:"Red flags", EXVRL:"Expectation vs reality", AITA:"AITA", DIL:"Dilemma",
        QUIZ:"Quiz", REV:"Review", COMM:"Comments", CAST:"Cast", NEWS:"News"},
  cta: {"0":"None", NEWEP:"New episode", FREE:"Free episodes", WATCH:"Watch now", LOCK:"Scene locked"},
  vo: {"0":"None", NAR:"Narrator", CH:"Character"},
};
const DIMS = [["dur","Duration"],["edit","Edit type"],["ins","Inserts"],["gfx","Graphics"],["cta","CTA"],["vo","Voiceover"],["mx","Music"]];
const OLD_NAME = "Named before the convention";
// files that carry an editor code (Bogdan BY/YB, Denis HE/DG, Mikita TZ) are in the new naming even when a code
// is not in the dictionary yet or a field is left out (Mika 9.11: Mikita's OL/HL/CHL and Denis's HE files must not sit with the old names)
const EDITOR_CODE = /^(BY|YB|HE|DG|TZ)$/i;
const SKIP = /^(\d+|B\d+|MX\d{3}|MU\d{3})$/i;
function parseNaming(name){
  const tk = String(name).split("_"), i = tk.findIndex(x => /^\d+(s|m)$/i.test(x));
  const e = tk.findIndex((x, j) => j >= 1 && j <= 3 && j < tk.length - 1 && EDITOR_CODE.test(x)); // a trailing _BY is Bogdan's pre-convention name
  const known = i >= 0 && NAMING.edit[(tk[i + 1] || "").toUpperCase()];
  if (!known && e < 0) return {nc:false};
  const m = tk.find(x => /^mx\d{3}$/i.test(x)), mx = m ? m.toUpperCase() : "Missing";
  if (i >= 0) { // positional: duration, then edit / inserts / graphics / CTA / voiceover
    const out = {nc:true, dur:tk[i].toLowerCase(), mx};
    ["edit","ins","gfx","cta","vo"].forEach((k, j) => { const c = (tk[i + 1 + j] || "").toUpperCase();
      out[k] = /^mx\d{3}$/i.test(c) || !c ? "Missing" : NAMING[k][c] || `Not in dictionary: ${c}`; });
    return out;
  }
  // no duration: pick up whatever dictionary codes appear after the editor code; anything unknown goes under Edit type
  const out = {nc:true, dur:"Missing", mx}, unknown = [];
  for (const x of tk.slice(e + 1)) { const c = x.toUpperCase(); if (SKIP.test(c) || c === "0") continue;
    const k = ["edit","ins","gfx","cta","vo"].find(k => NAMING[k][c] && !out[k]);
    if (k) out[k] = NAMING[k][c]; else if (/^[A-Z]{2,5}$/.test(c)) unknown.push(c); }
  if (!out.edit) out.edit = unknown.length ? `Not in dictionary: ${unknown.join(" ")}` : "Missing";
  for (const k of ["ins","gfx","cta","vo"]) out[k] = out[k] || "Missing";
  return out;
}

function start(){
  $("#lock").hidden = true; $("#app").hidden = false;
  const ac = D.ad_cols; AD = D.ads.map(a => Object.fromEntries(ac.map((k, i) => [k, a[i]])));
  for (const a of AD) { Object.assign(a, parseNaming(a.creative)); if (a.nc && !a.music && a.mx !== "Missing") a.music = a.mx; }
  state.dim = "edit"; $("#dim").innerHTML = DIMS.map(([k, l]) => `<option value="${k}">${l}</option>`).join("");
  $("#dim").onchange = e => { state.dim = e.target.value; state.sort = {key:"spend", dir:-1}; renderTable(); };
  ROWS = D.rows;
  const bc = D.blocked_cols || []; BL = (D.blocked || []).map(b => Object.assign(Object.fromEntries(bc.map((k, i) => [k, b[i]]))));
  for (const b of BL) Object.assign(b, parseNaming(b.creative));
  $("#updated").textContent = `Meta · ${D.since} → ${D.until} · updated ${D.generated}`;
  state.to = D.until; const f = new Date(D.until + "T00:00:00Z"); f.setUTCDate(f.getUTCDate() - 13); state.from = iso(f) < D.since ? D.since : iso(f);
  $("#from").min = $("#to").min = D.since; $("#from").max = $("#to").max = D.until;
  buildFilters(); render();
}

function buildFilters(){
  const eds = ["All", ...D.editors];
  $("#editors").innerHTML = eds.map(e => `<button class="chip" data-e="${esc(e)}">${esc(e)}</button>`).join("");
  $("#editors").onclick = e => { const b = e.target.closest("[data-e]"); if (!b) return; state.editor = b.dataset.e; state.limit = 150; render(); };
  $("#series").onchange = e => { state.series = e.target.value; state.limit = 150; render(); };
  const acc = [...new Set(AD.map(a => a.account))];
  $("#account").innerHTML = ["All", ...acc].map(s => `<option>${esc(s)}</option>`).join("");
  $("#account").onchange = e => { state.account = e.target.value; render(); };
  $("#tbl").onclick = e => { if (state.tab !== "series") return; const tr = e.target.closest("tr[data-g]"); if (!tr) return;
    state.series = tr.dataset.g; state.tab = "creatives"; state.sort = {key:"spend", dir:-1}; state.limit = 150; render(); };
  const presets = [["7d",7],["14d",14],["30d",30],["90d",90]];
  $("#presets").innerHTML = presets.map(([l, n]) => `<button class="chip" data-n="${n}">Last ${l}</button>`).join("");
  $("#presets").onclick = e => { const b = e.target.closest("[data-n]"); if (!b) return;
    const t = new Date(D.until + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() - (+b.dataset.n - 1));
    state.to = D.until; state.from = iso(t) < D.since ? D.since : iso(t); render(); };
  $("#from").onchange = e => { state.from = e.target.value || D.since; render(); };
  $("#to").onchange = e => { state.to = e.target.value || D.until; render(); };
  $("#q").oninput = e => { state.q = e.target.value.toLowerCase(); state.limit = 150; renderTable(); };
  $("#tested").onchange = e => { state.tested = e.target.checked; renderTable(); };
  $("#never").onchange = e => { state.hideNever = e.target.checked; renderTable(); };
  state.audm = "roas";
  $("#aud").onclick = e => { const b = e.target.closest("[data-am]"); if (b) { state.audm = b.dataset.am; return renderTable(); }
    const tr = e.target.closest("tr[data-ae]"); if (tr) { state.editor = tr.dataset.ae; render(); window.scrollTo({top:0, behavior:"smooth"}); return; }
    const ts = e.target.closest("tr[data-as]"); if (ts) { state.series = ts.dataset.as; render(); window.scrollTo({top:0, behavior:"smooth"}); } };
  const tabs = [["creatives","Creatives"],["blocked","Blocked"],["series","By series"],["weekly","Weekly trend"],["music","Music"],["format","Format"],["naming","Naming"],["audience","Audience"],["campaigns","Campaigns"]];
  $("#tabs").innerHTML = tabs.map(([k, l]) => `<button class="tab" data-t="${k}">${l}</button>`).join("");
  $("#tabs").onclick = e => { const b = e.target.closest("[data-t]"); if (!b) return; state.tab = b.dataset.t; state.sort = b.dataset.t === "blocked" ? {key:"date", dir:-1} : {key:"spend", dir:-1}; state.limit = 150; render(); };
  $("#more").onclick = () => { state.limit += 300; renderTable(); };
  $("#export").onclick = exportXlsx;
}

// ---------- aggregation ----------
function blank(){ return {spend:0, impr:0, clicks:0, purch:0, value:0, p25:0, p50:0, p75:0, p100:0, thru:0, watch:0, plays:0, ads:new Set(), weeks:[0,0,0,0].map(() => ({spend:0, value:0, purch:0}))}; }
function add(t, r, wk){
  t.spend += r[2]; t.impr += r[3]; t.clicks += r[4]; t.purch += r[5]; t.value += r[6];
  t.p25 += r[7]; t.p50 += r[8]; t.p75 += r[9]; t.p100 += r[10]; t.thru += r[11]; t.watch += r[12]; t.plays += r[13]; t.ads.add(r[1]);
  if (wk >= 0 && wk < 4) { t.weeks[wk].spend += r[2]; t.weeks[wk].value += r[6]; t.weeks[wk].purch += r[5]; }
}
function finish(t){
  t.roas = div(t.value, t.spend); t.cpa = div(t.spend, t.purch); t.cpm = div(t.spend * 1000, t.impr);
  t.ctr = div(t.clicks * 100, t.impr); t.w25 = div(t.p25 * 100, t.impr); t.keep = div(t.p50 * 100, t.p25);
  t.w75 = div(t.p75 * 100, t.impr); t.w100 = div(t.p100 * 100, t.impr); t.thrup = div(t.thru * 100, t.impr);
  t.avg = div(t.watch, t.plays); t.cpc = div(t.spend, t.clicks); t.c2p = div(t.purch * 100, t.clicks);
  t.wroas = t.weeks.map(w => w.spend ? w.value / w.spend : null).reverse(); // oldest → newest
  const [a, b] = [t.wroas[2], t.wroas[3]];
  t.trend = (a == null || b == null || t.weeks[0].spend < 5 || t.weeks[1].spend < 5) ? "" : b > a * 1.2 ? "Rising" : b < a * 0.8 ? "Dropping" : "Stable";
  t.nAds = t.ads.size; return t;
}
function inScope(a, ignoreEditor){
  return (ignoreEditor || state.editor === "All" || a.editor === state.editor) &&
         (state.series === "All" || a.series === state.series) &&
         (state.account === "All" || a.account === state.account);
}
function compute(){
  const lo = dayIdx(state.from), hi = dayIdx(state.to);
  const byCr = new Map(), whole = blank(), all = new Map();
  for (const r of ROWS) {
    if (r[0] < lo || r[0] > hi) continue;
    const a = AD[r[1]]; const wk = Math.floor((hi - r[0]) / 7);
    if (inScope(a, true)) {
      add(whole, r, wk);
      const k2 = a.editor + "|" + a.creative; if (!all.has(k2)) all.set(k2, blank()); add(all.get(k2), r, wk);
    }
    if (!inScope(a)) continue;
    const k = a.editor + "|" + a.creative;
    if (!byCr.has(k)) byCr.set(k, Object.assign(blank(), {meta:a, camps:new Set()}));
    const t = byCr.get(k); add(t, r, wk); t.camps.add(a.campaign);
  }
  const crs = [...byCr.values()].map(finish);
  const bl = new Map(); for (const b of blockedIn(true)) { const k = b.editor + "|" + b.creative; bl.set(k, (bl.get(k) || 0) + 1); }
  for (const t of crs) t.blocked = bl.get(t.meta.editor + "|" + t.meta.creative) || 0;
  // benchmarks for "where it breaks": all editors, same series/account/period, tested creatives
  const bench = [...all.values()].map(finish).filter(t => t.spend >= 15);
  const med = arr => { const s = arr.filter(v => v != null).sort((a, b) => a - b); return s.length ? s[Math.floor(s.length / 2)] : null; };
  const mCtr = med(bench.map(t => t.ctr)), mC2p = med(bench.map(t => t.c2p));
  for (const t of crs) {
    if (t.spend < 15 || mCtr == null) { t.breaks = ""; continue; }
    const hiC = (t.ctr ?? 0) >= mCtr, hiB = (t.c2p ?? 0) >= mC2p;
    t.breaks = hiC && hiB ? "Strong: people click and buy" : !hiC && hiB ? "Few click, but those who click buy" : hiC ? "Gets clicks, but the clicks do not buy" : "Weak on both";
  }
  return {crs, whole:finish(whole), lo, hi};
}

// series dropdown: only the series the chosen editor worked on in this period/account, biggest spend first
function buildSeries(){
  const lo = dayIdx(state.from), hi = dayIdx(state.to), m = new Map();
  for (const r of ROWS) { if (r[0] < lo || r[0] > hi) continue; const a = AD[r[1]];
    if ((state.editor !== "All" && a.editor !== state.editor) || (state.account !== "All" && a.account !== state.account)) continue;
    if (!m.has(a.series)) m.set(a.series, {spend:0, crs:new Set()}); const x = m.get(a.series); x.spend += r[2]; x.crs.add(a.editor + "|" + a.creative); }
  const ser = [...m.keys()].sort((a, b) => a === "Other" ? 1 : b === "Other" ? -1 : m.get(b).spend - m.get(a).spend);
  if (state.series !== "All" && !m.has(state.series)) state.series = "All";
  $("#series").innerHTML = `<option value="All">All (${ser.length} series)</option>` +
    ser.map(s => `<option value="${esc(s)}">${esc(s)} · ${m.get(s).crs.size} creative${m.get(s).crs.size > 1 ? "s" : ""} · ${fmt$(m.get(s).spend)}</option>`).join("");
  $("#series").value = state.series;
}

// ---------- blocked ads (from 9.11 on): the original creative that Meta rejected, even after the team swapped it ----------
// the date filter reads "to the end" when it ends on the last data day, so today's rejections show up
function blockedIn(withNever){
  return BL.filter(b => inScope(b) && b.date >= state.from && (state.to === D.until || b.date <= state.to) &&
    (!state.q || b.creative.toLowerCase().includes(state.q)) && (withNever || !state.hideNever || b.ran));
}
const statusPill = s => `<span class="pill ${s === "Still blocked" ? "b" : s === "Approved again" ? "g" : "w"}">${esc(s)}</span>`;
const thumbCell = (src, name, sub) => `<div class="cr">${src ? `<img class="thumb" loading="lazy" src="${esc(src)}" data-big="${esc(src)}" alt="">` : `<div class="thumb"></div>`}<div><div class="t" title="${esc(name)}">${esc(name || "–").replace(/([_\-.])/g, "$1<wbr>")}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div></div>`;
const BCOLS = [
  ["creative","Original creative (blocked)",b=>b.creative,(v,b)=>thumbCell(b.thumb, v, `${b.drive ? `<a class="drv" href="https://drive.google.com/file/d/${esc(b.drive)}/view" target="_blank" rel="noopener">Drive ↗</a> · ` : ""}${esc(b.series)}${b.ran ? "" : ' · <span class="pill n">Never ran</span>'}`),1],
  ["editor","Editor",b=>b.editor,v=>`<span class="ed">${esc(v)}</span>`,1],
  ["date","Blocked on",b=>b.date,v=>esc(v),1],
  ["kind","Block type",b=>b.kind || "Rejected",v=>`<span class="pill b">${esc(v)}</span>`,1],
  ["status","Status now",b=>b.status,statusPill,1],
  ["new_name","Replaced with",b=>b.new_name,(v,b)=>v ? thumbCell(b.new_thumb, v.replace(/^CR\s+/, "").replace(/\s*\[.*$/, "")) : '<span class="muted">–</span>',1],
  ["reason","Reason",b=>b.reason,v=>v ? esc(v) : '<span class="muted" title="Meta shows the reason only while the ad is still rejected">–</span>',1],
  ["campaign","Campaign",b=>b.campaign,v=>esc(v),1],
  ["account","Account",b=>b.account,v=>esc(v),1],
];

// ---------- rendering ----------
let C;
function render(){
  document.querySelectorAll("#editors .chip").forEach(b => b.classList.toggle("on", b.dataset.e === state.editor));
  document.querySelectorAll("#tabs .tab").forEach(b => b.classList.toggle("on", b.dataset.t === state.tab));
  document.querySelectorAll("#presets .chip").forEach(b => { const t = new Date(D.until + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() - (+b.dataset.n - 1));
    const f = iso(t) < D.since ? D.since : iso(t); b.classList.toggle("on", state.to === D.until && state.from === f); });
  $("#from").value = state.from; $("#to").value = state.to;
  buildSeries(); C = compute(); renderKpis(); renderTable();
}
function renderKpis(){
  const t = finish(C.crs.reduce((acc, c) => { for (const k of ["spend","impr","clicks","purch","value","p25","p50","p75","p100","thru","watch","plays"]) acc[k] += c[k]; return acc; }, blank()));
  const tested = C.crs.filter(c => c.spend >= 15).length, w = C.whole;
  const cmp = state.editor === "All" ? "" : (v, f) => `All editors: ${f(v)}`;
  const k = (l, v, c) => `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="c">${c || "&nbsp;"}</div></div>`;
  $("#kpis").innerHTML =
    k("Spend", fmt$(t.spend), cmp && `${fmtN(t.spend / (w.spend || 1) * 100)}% of all editors`) +
    k("Purchases", fmtN(t.purch), cmp && cmp(w.purch, fmtN)) +
    k("ROAS", fmtR(t.roas), cmp && cmp(w.roas, fmtR)) +
    k("Cost per purchase", fmt$(t.cpa), cmp && cmp(w.cpa, fmt$)) +
    k("Creatives", fmtN(C.crs.length), `${tested} tested (≥ $15)`) +
    k("Link CTR", fmtP(t.ctr), cmp && cmp(w.ctr, fmtP));
}

const roasCls = v => v == null ? "" : v >= 0.6 ? "roas-good" : v < 0.35 ? "roas-bad" : "";
const breaksPill = s => !s ? "" : `<span class="pill ${s.startsWith("Strong") ? "g" : s.startsWith("Weak") ? "b" : "w"}">${esc(s)}</span>`;
const trendPill = s => !s ? "" : `<span class="pill ${s === "Rising" ? "g" : s === "Dropping" ? "b" : "n"}">${s}</span>`;
const spark = arr => { const m = Math.max(...arr.map(v => v || 0), .01);
  return `<span class="spark" title="ROAS by week, oldest → newest: ${arr.map(fmtR).join(" · ")}">${arr.map(v => `<i style="height:${v == null ? 1 : Math.max(2, v / m * 22)}px;${v == null ? "opacity:.2" : ""}"></i>`).join("")}</span>`; };

// column defs: [key, label, value fn, render fn, align-left]
const MET = [
  ["spend","Spend ($)",t=>t.spend,fmt$],["purch","Purchases",t=>t.purch,fmtN],["roas","ROAS",t=>t.roas,v=>`<span class="${roasCls(v)}">${fmtR(v)}</span>`],
  ["cpa","Cost / purchase",t=>t.cpa,fmt$],["impr","Impressions",t=>t.impr,fmtN],["cpm","CPM",t=>t.cpm,fmt$],["ctr","Link CTR",t=>t.ctr,fmtP],
  ["w25","Watched 25%",t=>t.w25,fmtP],["keep","Kept 25→50%",t=>t.keep,fmtP],["w75","Watched 75%",t=>t.w75,fmtP],["w100","Watched 100%",t=>t.w100,fmtP],
  ["thrup","ThruPlay",t=>t.thrup,fmtP],["avg","Avg watch",t=>t.avg,fmtS],["cpc","Cost / click",t=>t.cpc,fmt$],["c2p","Click → purchase",t=>t.c2p,fmtP],
];
function cols(){
  if (state.tab === "blocked") return BCOLS;
  if (state.tab === "creatives") return [
    ["creative","Creative",t=>t.meta.creative,(v,t)=>`<div class="cr">${t.meta.thumb?`<img class="thumb" loading="lazy" src="${esc(t.meta.thumb)}" data-big="${esc(t.meta.thumb)}" alt="">`:`<div class="thumb"></div>`}<div><div class="t" title="${esc(v)}">${esc(v).replace(/([_\-.])/g, "$1<wbr>")}</div><div class="s">${t.meta.drive?`<a class="drv" href="https://drive.google.com/file/d/${esc(t.meta.drive)}/view" target="_blank" rel="noopener">Drive ↗</a> · `:""}${esc(t.meta.series)} · ${t.nAds} ad${t.nAds>1?"s":""} · ${t.camps.size} campaign${t.camps.size>1?"s":""}</div></div></div>`,1],
    ["editor","Editor",t=>t.meta.editor,v=>`<span class="ed">${esc(v)}</span>`,1],
    ["format","Format",t=>t.meta.format,v=>esc(v)||'<span class="muted">–</span>',1],
    ["music","Music",t=>t.meta.music,v=>esc(v)||'<span class="muted">–</span>',1],
    ["blocked","Blocked",t=>t.blocked,v=>v ? `<span class="pill b">${v}</span>` : '<span class="muted">–</span>'],
    ...MET,
    ["breaks","Where it breaks",t=>t.breaks,breaksPill,1],
    ["wk","ROAS by week",t=>t.wroas[3],(v,t)=>spark(t.wroas),1],
    ["trend","Trend",t=>t.trend,trendPill,1],
  ];
  const label = {series:"Series", music:"Music", format:"Format", campaigns:"Campaign", weekly:"Week", naming:(DIMS.find(d => d[0] === state.dim) || [,""])[1]}[state.tab];
  const bcols = state.tab === "weekly" ? [] : [["bl","Blocked",t=>t.bl,v=>v ? `<span class="pill b">${v}</span>` : '<span class="muted">–</span>'],["blr","Block rate",t=>t.blr,fmtP]];
  return [["g",label,t=>t.g,v=>esc(v),1],["n","Creatives",t=>t.nCr,fmtN],["nt","Tested",t=>t.nT,fmtN],...bcols,...MET.slice(0,7),...MET.slice(7)];
}
function groupRows(){
  let crs = C.crs.filter(t => !state.q || t.meta.creative.toLowerCase().includes(state.q));
  if (state.tab === "blocked") return blockedIn(false);
  if (state.tab === "creatives") return state.tested ? crs.filter(t => t.spend >= 15) : crs;
  if (state.tab === "weekly") return weekly();
  const keyFn = {series:t=>[t.meta.series], music:t=>[t.meta.music||"(none in name)"], format:t=>[t.meta.format||"(none in name)"], naming:t=>[t.meta.nc ? t.meta[state.dim] : OLD_NAME], campaigns:t=>[...t.camps]}[state.tab];
  const g = new Map();
  for (const t of crs) for (const k of keyFn(t)) {
    if (!g.has(k)) g.set(k, Object.assign(blank(), {g:k, nCr:0, nT:0}));
    const x = g.get(k); x.nCr++; if (t.spend >= 15) x.nT++;
    for (const f of ["spend","impr","clicks","purch","value","p25","p50","p75","p100","thru","watch","plays"]) x[f] += state.tab === "campaigns" && t.camps.size > 1 ? 0 : t[f];
  }
  if (state.tab === "campaigns") { // campaign totals must come from rows, not from creatives
    const lo = C.lo, hi = C.hi; for (const x of g.values()) for (const f of ["spend","impr","clicks","purch","value","p25","p50","p75","p100","thru","watch","plays"]) x[f] = 0;
    const keys = new Set(crs.map(t => t.meta.editor + "|" + t.meta.creative));
    for (const r of ROWS) { if (r[0] < lo || r[0] > hi) continue; const a = AD[r[1]]; if (!inScope(a) || !keys.has(a.editor + "|" + a.creative)) continue;
      const x = g.get(a.campaign); if (x) add(x, r, -1); }
  }
  // Blocked = distinct blocked creatives in the group; Block rate = blocked ÷ all creatives in the group (those that ran + blocked ones that never did)
  const keyB = {series:b=>[b.series], music:b=>[b.music||"(none in name)"], format:b=>[b.format||"(none in name)"], naming:b=>[b.nc ? b[state.dim] : OLD_NAME], campaigns:b=>[b.campaign]}[state.tab];
  const mem = new Map(); for (const t of crs) for (const k of keyFn(t)) { if (!mem.has(k)) mem.set(k, {all:new Set(), bl:new Set()}); mem.get(k).all.add(t.meta.editor + "|" + t.meta.creative); }
  for (const b of blockedIn(false)) for (const k of keyB(b)) { if (!g.has(k)) continue; const m = mem.get(k); const id = b.editor + "|" + b.creative; m.all.add(id); m.bl.add(id); }
  for (const [k, x] of g) { const m = mem.get(k); x.bl = m ? m.bl.size : 0; x.blr = m && m.all.size ? x.bl * 100 / m.all.size : null; }
  return [...g.values()].map(finish);
}
function weekly(){
  const out = []; const lo = C.lo, hi = C.hi;
  const keys = new Set(C.crs.filter(t => !state.q || t.meta.creative.toLowerCase().includes(state.q)).map(t => t.meta.editor + "|" + t.meta.creative));
  for (let end = hi; end >= lo; end -= 7) {
    const start = Math.max(lo, end - 6), x = Object.assign(blank(), {g:`${iso(dayDate(start)).slice(5)} → ${iso(dayDate(end)).slice(5)}`, _o:end});
    const crSet = new Map();
    for (const r of ROWS) { if (r[0] < start || r[0] > end) continue; const a = AD[r[1]]; if (!inScope(a) || !keys.has(a.editor + "|" + a.creative)) continue;
      add(x, r, -1); const k = a.editor + "|" + a.creative; crSet.set(k, (crSet.get(k) || 0) + r[2]); }
    x.nCr = crSet.size; x.nT = [...crSet.values()].filter(v => v >= 15).length; out.push(finish(x));
  }
  return out;
}
function renderTable(){
  const au = state.tab === "audience"; $("#tblwrap").hidden = au; $("#aud").hidden = !au; $("#q").hidden = au;
  if (au) { $("#testedwrap").hidden = $("#neverwrap").hidden = $("#dimwrap").hidden = $("#morewrap").hidden = true; return renderAudience(); }
  $("#dimwrap").hidden = state.tab !== "naming";
  $("#neverwrap").hidden = state.tab !== "blocked"; $("#testedwrap").hidden = state.tab === "blocked";
  const cs = cols(); let rows = groupRows();
  const sc = cs.find(c => c[0] === state.sort.key) || cs.find(c => c[0] === "spend") || cs.find(c => c[0] === "date");
  if (state.tab === "weekly" && state.sort.key === "spend" && state.sort.dir === -1 && !state._wsorted) rows.sort((a, b) => b._o - a._o);
  else rows.sort((a, b) => { const x = sc[2](a), y = sc[2](b);
    if (x == null || x === "") return 1; if (y == null || y === "") return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * state.sort.dir; });
  C.view = {cs, rows};
  const shown = rows.slice(0, state.limit);
  $("#tbl").innerHTML = `<thead><tr>${cs.map(c => `<th class="${c[4] ? "l" : ""}" data-k="${c[0]}">${c[1]} <span class="arr">${state.sort.key === c[0] ? (state.sort.dir < 0 ? "↓" : "↑") : ""}</span></th>`).join("")}</tr></thead>
    <tbody>${shown.map(t => `<tr${state.tab === "series" ? ` class="go" data-g="${esc(t.g)}" title="Show this series' creatives"` : ""}>${cs.map(c => `<td class="${c[4] ? "l" : ""}${c[0] === "creative" ? " name" : ""}">${c[3](c[2](t), t)}</td>`).join("")}</tr>`).join("") ||
    `<tr><td class="l muted" colspan="${cs.length}" style="padding:30px">Nothing matches these filters.</td></tr>`}</tbody>`;
  $("#tbl thead").onclick = e => { const th = e.target.closest("th"); if (!th) return; const k = th.dataset.k;
    state._wsorted = true; state.sort = {key:k, dir: state.sort.key === k ? -state.sort.dir : (["creative","editor","format","music","g","breaks","trend","kind","status","new_name","reason","campaign","account"].includes(k) ? 1 : -1)}; renderTable(); };
  $("#count").textContent = `${rows.length.toLocaleString("en-US")} rows`;
  $("#morewrap").hidden = rows.length <= state.limit;
  $("#note").textContent = state.tab === "creatives"
    ? "A creative = all ads with the same file name (copies merged). ROAS = purchase value ÷ spend, 7-day click / 1-day view. “Where it breaks” compares link CTR and click→purchase against the median of all tested creatives in the same filters. Trend compares the last two weeks of the period."
    : state.tab === "blocked" ? `One row per original creative that Meta rejected or marked “With issues” (also a rejection: the ad cannot be turned back on), counted from ${(D.blocked_since || "9.11.2026")}. The team usually swaps the video in a rejected ad; this shows the one that was blocked, and what replaced it. The reason shows only while the ad is still rejected. “Never ran” = rejected at review, before the ad ever spent (e.g. a new or dummy campaign); tick the box to hide them.`
    : state.tab === "series" ? "Totals for the creatives that match the current filters. Click a series to see its creatives."
    : state.tab === "naming" ? "Reads the editors' naming convention from the file name: SERIES_EDITOR_BATCH_AD_duration_edit_inserts_graphics_cta_voiceover_mx###. Files with an editor code count as the new naming even if a code is not in the dictionary yet (shown as “Not in dictionary: …”) or a field is missing. Files with no editor code show as “Named before the convention”."
    : "Totals for the creatives that match the current filters.";
}

// ---------- audience: age x gender from Meta, per editor and per series (Mika 9.11) ----------
// fetch.py sums Meta's age/gender breakdown per week x (editor, series, account); weeks end on the last data day
const AGES = ["18-24","25-34","35-44","45-54","55-64","65+"];
const AUD_MIN = 5; // cells with fewer purchases are shown faded: too few to read
function audWeeks(){
  if (!D.aud) return [];
  const base = new Date(D.aud_since + "T00:00:00Z"), out = [];
  for (let w = 0; w < D.aud_weeks; w++) { const s = new Date(base); s.setUTCDate(s.getUTCDate() + 7 * w); const e = new Date(s); e.setUTCDate(e.getUTCDate() + 6);
    // a week counts when at least 4 of its 7 days are inside the chosen period
    const lo = Math.max(+s, +new Date(state.from + "T00:00:00Z")), hi = Math.min(+e, +new Date(state.to + "T00:00:00Z"));
    if ((hi - lo) / 864e5 + 1 >= 4) out.push({w, s:iso(s), e:iso(e)}); }
  return out;
}
const segOf = s => { const [g, a] = s.split("|"); return {g: g === "female" ? "Women" : g === "male" ? "Men" : "Unknown", a: AGES.includes(a) ? a : "Unknown"}; };
function audAgg(useEdSer){
  const ws = new Set(audWeeks().map(x => x.w)), G = D.aud_groups, S = D.aud_segs.map(segOf), out = [];
  for (const r of D.aud) { if (!ws.has(r[0])) continue; const [ed, ser, acc] = G[r[1]];
    if (state.account !== "All" && acc !== state.account) continue;
    if (useEdSer && ((state.editor !== "All" && ed !== state.editor) || (state.series !== "All" && ser !== state.series))) continue;
    out.push({w:r[0], ed, ser, acc, ...S[r[2]], spend:r[3], impr:r[4], clicks:r[5], purch:r[6], value:r[7]}); }
  return out;
}
const audBlank = () => ({spend:0, impr:0, clicks:0, purch:0, value:0});
function audAdd(x, r){ x.spend += r.spend; x.impr += r.impr; x.clicks += r.clicks; x.purch += r.purch; x.value += r.value; return x; }
function audSummary(rows, keyFn, title, sub){
  const g = new Map(), tot = audBlank(); for (const r of rows) { const k = keyFn(r); if (!g.has(k)) g.set(k, Object.assign(audBlank(), {k})); audAdd(g.get(k), r); audAdd(tot, r); }
  const order = [...AGES, "Women", "Men", "Unknown"], list = [...g.values()].sort((a, b) => order.indexOf(a.k) - order.indexOf(b.k));
  const maxSp = Math.max(...list.map(x => x.spend), 1);
  const body = list.map(x => `<tr><td class="l">${esc(x.k)}</td><td>${fmt$(x.spend)}<span class="bar" style="width:${Math.round(x.spend / maxSp * 60)}px"></span></td><td>${fmtP(div(x.spend * 100, tot.spend))}</td>
    <td>${fmtN(x.purch)}</td><td>${fmtP(div(x.purch * 100, tot.purch))}</td><td><span class="${roasCls(div(x.value, x.spend))}">${fmtR(div(x.value, x.spend))}</span></td><td>${fmt$(div(x.spend, x.purch))}</td>
    <td>${fmtN(x.clicks)}</td><td>${fmtP(div(x.clicks * 100, tot.clicks))}</td><td>${fmtP(div(x.purch * 100, x.clicks))}</td><td>${fmtN(div(x.clicks, x.purch))}</td></tr>`).join("");
  return `<h3>${title}</h3><div class="sub2">${sub}</div><div class="tablewrap"><table><thead><tr><th class="l"></th><th>Spend</th><th>Share of spend</th><th>Purchases</th><th>Share of purchases</th><th>ROAS</th><th>Cost / purchase</th><th>Link clicks</th><th>Share of clicks</th><th>Click → purchase</th><th>Clicks per purchase</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
const PCOL = {Women:["#f3c3d8","#d64f8a"], Men:["#bcd0ff","#2f6bff"]};
const pctS = v => v == null ? "–" : (v * 100).toFixed(v < .1 ? 1 : 0) + "%";
function segTotals(rows){ // age x gender cells, plus totals
  const m = new Map(), tot = audBlank();
  for (const r of rows) { const k = r.g + "|" + r.a; if (!m.has(k)) m.set(k, Object.assign(audBlank(), {g:r.g, a:r.a})); audAdd(m.get(k), r); audAdd(tot, r); }
  return {m, tot};
}
function audCards(rows){
  const {m, tot} = segTotals(rows), cells = [...m.values()].filter(x => x.g !== "Unknown" && x.a !== "Unknown" && x.purch >= 10);
  const best = cells.sort((x, y) => x.spend / x.purch - y.spend / y.purch)[0];
  const ages = new Map(); for (const r of rows) { if (r.a === "Unknown") continue; if (!ages.has(r.a)) ages.set(r.a, Object.assign(audBlank(), {a:r.a})); audAdd(ages.get(r.a), r); }
  const room = [...ages.values()].filter(x => x.purch >= 10).sort((x, y) => y.value / y.spend - x.value / x.spend)[0];
  // biggest change: the last two whole weeks in the period, same age x gender cell, 10+ purchases in both
  const ws = audWeeks(), w1 = ws.length ? ws[ws.length - 1].w : null, w0 = ws.length > 1 ? ws[ws.length - 2].w : null;
  let chg = null;
  if (w0 != null) { const pick = w => { const mm = new Map(); for (const r of rows) { if (r.w !== w || r.g === "Unknown" || r.a === "Unknown") continue; const k = r.g + "|" + r.a; if (!mm.has(k)) mm.set(k, Object.assign(audBlank(), {g:r.g, a:r.a})); audAdd(mm.get(k), r); } return mm; };
    const A = pick(w0), B = pick(w1);
    for (const [k, b] of B) { const a = A.get(k); if (!a || a.purch < 10 || b.purch < 10) continue; const ra = a.value / a.spend, rb = b.value / b.spend;
      if (!chg || Math.abs(rb - ra) > Math.abs(chg.rb - chg.ra)) chg = {g:b.g, a:b.a, ra, rb}; } }
  if (chg && Math.abs(chg.rb - chg.ra) < .03) chg = {flat:true};
  const card = (l, v, c) => `<div class="card"><div class="l">${l}</div><div class="v">${v}</div><div class="c">${c}</div></div>`;
  return `<div class="acards">` +
    card("Best-buying audience", best ? `${best.g} ${best.a.replace("-", "–")}` : "–", best ? `${fmt$(best.spend / best.purch)} per purchase · overall ${fmt$(div(tot.spend, tot.purch))}` : "Not enough purchases") +
    card("Room to grow", room ? `Ages ${room.a.replace("-", "–")}` : "–", room ? `Best ROAS (${fmtR(room.value / room.spend)}), yet only ${pctS(room.spend / tot.spend)} of spend` : "Not enough purchases") +
    card("Biggest change vs last week", chg && chg.flat ? "No big change" : chg ? `${chg.g} ${chg.a.replace("-", "–")} ${chg.rb > chg.ra ? "↑" : "↓"}` : "–", chg && chg.flat ? "No group moved more than 0.03 in ROAS" : chg ? `ROAS ${fmtR(chg.ra)} → ${fmtR(chg.rb)}` : "Needs two whole weeks in the period") + `</div>`;
}
function audPyramid(rows){
  const {m, tot} = segTotals(rows), get = (g, a) => m.get(g + "|" + a) || audBlank();
  let mx = .001; for (const a of AGES) for (const g of ["Women","Men"]) { const x = get(g, a); mx = Math.max(mx, div(x.spend, tot.spend) || 0, div(x.purch, tot.purch) || 0); }
  const bar = (v, c) => `<div class="pb" style="width:${Math.max(2, (v || 0) / mx * 100)}%;background:${c}"><span>${pctS(v)}</span></div>`;
  return `<div class="pyr">${AGES.map(a => { const w = get("Women", a), mn = get("Men", a);
    return `<div class="side l">${bar(div(w.spend, tot.spend), PCOL.Women[0])}${bar(div(w.purch, tot.purch), PCOL.Women[1])}</div><div class="age">${a.replace("-", "–")}</div><div class="side r">${bar(div(mn.spend, tot.spend), PCOL.Men[0])}${bar(div(mn.purch, tot.purch), PCOL.Men[1])}</div>`; }).join("")}</div>
    <div class="legend"><span><i style="background:${PCOL.Women[0]}"></i>Women · share of spend</span><span><i style="background:${PCOL.Women[1]}"></i>Women · share of purchases</span><span><i style="background:${PCOL.Men[0]}"></i>Men · share of spend</span><span><i style="background:${PCOL.Men[1]}"></i>Men · share of purchases</span></div>`;
}
// heatmap: the number is the chosen metric; the color is ROAS against the account average for the same column (Mika 9.11: colors by the average)
function audHeat(rows, avgRows, keyFn, attr, first){
  const m = state.audm, cols = ["Women", "Men", ...AGES], g = new Map(), avg = Object.fromEntries(cols.map(c => [c, audBlank()]));
  for (const r of avgRows) { if (avg[r.g]) audAdd(avg[r.g], r); if (avg[r.a]) audAdd(avg[r.a], r); }
  for (const r of rows) { const k = keyFn(r); if (!g.has(k)) g.set(k, {k, all:audBlank(), c:Object.fromEntries(cols.map(c => [c, audBlank()]))});
    const x = g.get(k); audAdd(x.all, r); if (x.c[r.g]) audAdd(x.c[r.g], r); if (x.c[r.a]) audAdd(x.c[r.a], r); }
  const list = [...g.values()].filter(x => x.all.spend >= 15).sort((a, b) => b.all.spend - a.all.spend);
  const show = x => m === "roas" ? fmtR(div(x.value, x.spend)) : m === "cpa" ? fmt$(div(x.spend, x.purch)) : fmtN(x.purch);
  const cell = (x, c) => { if (x.purch < AUD_MIN) return `<td class="thin" title="${fmtN(x.purch)} purchases: too few to read">${show(x)}</td>`;
    const r = div(x.value, x.spend), a = div(avg[c].value, avg[c].spend), d = a ? r / a : 1;
    return `<td class="${d >= 1.08 ? "hg" : d <= .92 ? "hb" : "hn"}" title="ROAS ${fmtR(r)} · account ${fmtR(a)} · ${fmtN(x.purch)} purchases · ${fmt$(x.spend)}">${show(x)}</td>`; };
  const head = `<tr><th class="l">${first}</th><th>Spend</th>${cols.map(c => `<th>${c.replace("-", "–")}</th>`).join("")}</tr>`;
  const body = list.map(x => `<tr data-${attr}="${esc(x.k)}" title="Show only ${esc(x.k)}"><td class="l">${esc(x.k)}</td><td class="tot">${fmt$(x.all.spend)}</td>${cols.map(c => cell(x.c[c], c)).join("")}</tr>`).join("")
    || `<tr><td class="l muted" colspan="${cols.length + 2}" style="padding:20px">Nothing matches these filters.</td></tr>`;
  const avgRow = `<tr class="avg"><td class="l">Account average</td><td></td>${cols.map(c => `<td>${show(avg[c])}</td>`).join("")}</tr>`;
  return `<div class="tablewrap"><table class="hm">${head}${body}${avgRow}</table></div>`;
}
function renderAudience(){
  const note = $("#note");
  if (!D.aud) { $("#aud").innerHTML = `<div class="note" style="padding:30px">The age and gender data arrives with the next morning update.</div>`; note.textContent = ""; $("#count").textContent = ""; return; }
  const ws = audWeeks(), acc = state.account === "All" ? "all accounts" : state.account;
  const wtxt = ws.length ? `${ws[0].s.slice(5)} → ${ws[ws.length - 1].e.slice(5)}` : "no whole week in this period";
  const whole = audAgg(false), sel = audAgg(true);
  const scope = [state.editor !== "All" ? state.editor : "", state.series !== "All" ? state.series : ""].filter(Boolean).join(" · ") || "All editors and series";
  const btn = (k, l) => `<button data-am="${k}" class="${state.audm === k ? "on" : ""}">${l}</button>`;
  $("#aud").innerHTML = audCards(sel) +
    `<h3>Who gets the money, and who buys</h3><div class="sub2">${esc(scope)} · ${esc(acc)} · ${wtxt}. Light bar = share of spend, dark bar = share of purchases. Dark longer than light: the group brings back more than it gets.</div>` + audPyramid(sel) +
    `<div class="hdr"><div><h3>By editor</h3><div class="sub2">Green: this group buys better from this editor than across the account. Red: worse. Striped: fewer than ${AUD_MIN} purchases. Click a row to see only that editor.</div></div><div class="seg">${btn("roas","ROAS")}${btn("cpa","Cost / purchase")}${btn("purch","Purchases")}</div></div>` +
    audHeat(sel, whole, r => r.ed, "ae", "Editor") +
    `<h3>By series</h3><div class="sub2">Same colors. Series with at least $15 spend. Click a row to see only that series.</div>` + audHeat(sel, whole, r => r.ser, "as", "Series") +
    `<details><summary>Detailed tables: the whole account by gender and by age</summary>` +
    audSummary(whole, r => r.g, "Account · by gender", `Every ad in ${esc(acc)}, ${wtxt}. Editor and series filters do not apply here.`) +
    audSummary(whole, r => r.a, "Account · by age", `Every ad in ${esc(acc)}, ${wtxt}.`) + `</details>`;
  $("#count").textContent = "";
  note.textContent = `Meta's own age and gender breakdown, 7-day click / 1-day view, the same purchases as the rest of the page. Counted in whole weeks that end on the last data day: a week counts when at least 4 of its days are inside the dates you chose. “Biggest change” compares the last two weeks of the period, for groups with 10+ purchases in both. Downloads are not included.`;
}
function audienceSheet(){
  const out = [["Section","Group","Gender","Age","Spend","Purchases","Purchase value","ROAS","Cost / purchase","Link clicks","Clicks per purchase"]];
  if (!D.aud) return XLSX.utils.aoa_to_sheet(out);
  const push = (sec, rows, keyFn) => { const g = new Map(); for (const r of rows) { const k = keyFn(r) + "\u0000" + r.g + "\u0000" + r.a; if (!g.has(k)) g.set(k, Object.assign(audBlank(), {k:keyFn(r), g:r.g, a:r.a})); audAdd(g.get(k), r); }
    for (const x of [...g.values()].sort((a, b) => b.spend - a.spend)) out.push([sec, x.k, x.g, x.a, +x.spend.toFixed(2), x.purch, +x.value.toFixed(2), +(div(x.value, x.spend) || 0).toFixed(2), x.purch ? +(x.spend / x.purch).toFixed(2) : "", x.clicks, x.purch ? Math.round(x.clicks / x.purch) : ""]); };
  push("Account", audAgg(false), r => state.account === "All" ? "All accounts" : state.account);
  const sel = audAgg(true); push("Editor", sel, r => r.ed); push("Series", sel, r => r.ser);
  return XLSX.utils.aoa_to_sheet(out);
}

// thumbnail preview on hover
document.addEventListener("mouseover", e => { const im = e.target.closest("img.thumb"); const p = $("#preview");
  if (!im) { p.style.display = "none"; return; } p.src = im.dataset.big; p.style.display = "block"; });
document.addEventListener("mousemove", e => { const p = $("#preview"); if (p.style.display !== "block") return;
  const x = Math.min(e.clientX + 18, innerWidth - 250), y = Math.min(e.clientY - 40, innerHeight - 430); p.style.left = x + "px"; p.style.top = Math.max(8, y) + "px"; });

// ---------- export ----------
function blockedSheet(){
  const head = ["Original creative","Series","Editor","Blocked on","Block type","Status now","Replaced with","Reason","Campaign","Account","Ran","Drive"];
  const body = blockedIn(true).sort((a, b) => b.date.localeCompare(a.date)).map(b => [b.creative, b.series, b.editor, b.date, b.kind || "Rejected", b.status, b.new_name, b.reason, b.campaign, b.account, b.ran ? "yes" : "never ran", b.drive ? "https://drive.google.com/file/d/" + b.drive + "/view" : ""]);
  return XLSX.utils.aoa_to_sheet([head, ...body]);
}
function sheetFrom(tab){
  const keep = {tab:state.tab, limit:state.limit}; state.tab = tab; const cs = cols(); const rows = groupRows();
  rows.sort((a, b) => tab === "weekly" ? b._o - a._o : (b.spend - a.spend)); state.tab = keep.tab;
  const plain = (c, t) => { const v = c[2](t); if (c[0] === "wk") return t.wroas.map(fmtR).join(" · "); return typeof v === "number" ? Math.round(v * 100) / 100 : v ?? ""; };
  const head = cs.map(c => c[1]); if (tab === "creatives") head.splice(1, 0, "Series", "Ads", "Campaigns", "Ratio", "Drive", ...DIMS.map(d => d[1]));
  const body = rows.map(t => { const r = cs.map(c => plain(c, t)); if (tab === "creatives") r.splice(1, 0, t.meta.series, t.nAds, [...t.camps].join(" | "), t.meta.ratio, t.meta.drive ? "https://drive.google.com/file/d/" + t.meta.drive + "/view" : "", ...DIMS.map(d => t.meta.nc ? t.meta[d[0]] : "")); return r; });
  return XLSX.utils.aoa_to_sheet([head, ...body]);
}
// every naming field on one sheet: Field | Value | the usual metrics
function namingSheet(){
  const keep = {tab:state.tab, dim:state.dim}, out = [];
  for (const [k, l] of DIMS) {
    state.tab = "naming"; state.dim = k; const cs = cols(); const rows = groupRows().sort((a, b) => b.spend - a.spend);
    if (!out.length) out.push(["Field", ...cs.map(c => c[1]).slice(0, 1).map(() => "Value"), ...cs.slice(1).map(c => c[1])]);
    for (const t of rows) out.push([l, ...cs.map(c => { const v = c[2](t); return typeof v === "number" ? Math.round(v * 100) / 100 : v ?? ""; })]);
  }
  Object.assign(state, keep);
  return XLSX.utils.aoa_to_sheet(out);
}
function exportXlsx(){
  if (!window.XLSX) return;
  const wb = XLSX.utils.book_new();
  const crs = state.tested; // respect tested toggle for the creatives sheet
  const info = [["Gamma Creative Analytics"],["Editor", state.editor],["Series", state.series],["Account", state.account],["From", state.from],["To", state.to],["Search", state.q || "–"],["Tested only", crs ? "yes (spend ≥ $15)" : "no"],["Data updated", D.generated]];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(info), "Filters");
  for (const [k, n] of [["creatives","Creatives"],["series","By Series"],["weekly","Weekly"],["music","Music"],["format","Format"],["campaigns","Campaigns"]]) XLSX.utils.book_append_sheet(wb, sheetFrom(k), n);
  XLSX.utils.book_append_sheet(wb, namingSheet(), "Naming");
  XLSX.utils.book_append_sheet(wb, blockedSheet(), "Blocked");
  XLSX.utils.book_append_sheet(wb, audienceSheet(), "Audience");
  const name = `Creative Analytics - ${state.editor === "All" ? "All editors" : state.editor}${state.series === "All" ? "" : " - " + state.series.replace(/[\\/:*?"<>|]/g, "")} - ${state.from} to ${state.to}.xlsx`;
  XLSX.writeFile(wb, name);
}
