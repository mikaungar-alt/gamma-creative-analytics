name: Refresh data
on:
  schedule:
    - cron: "0 8 * * *"    # every morning, 10:00 Israel winter time (11:00 in summer)
    - cron: "0 10 * * *"   # backup two hours later, in case GitHub skips the first
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==43.0.3
      # A push only changes the page: reuse the data already live, pull from Meta only if that fails
      - name: Reuse the live data
        id: reuse
        if: github.event_name == 'push'
        continue-on-error: true
        run: curl -fsS -o site/data.enc "https://mikaungar-alt.github.io/gamma-creative-analytics/data.enc" && python -c "import json;d=json.load(open('site/data.enc'));assert d['ct']"
      # Kfir pushes the encrypted file name -> Drive link map to the drive-map branch every morning
      - name: Get the Drive map
        continue-on-error: true
        run: git fetch --depth 1 origin drive-map && git show FETCH_HEAD:drive.enc > drive.enc
      - name: Pull Meta data and encrypt
        if: github.event_name != 'push' || steps.reuse.outcome != 'success'
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          DRIVE_KEY: ${{ secrets.DRIVE_KEY }}
          DAYS: "90"
        run: python -u fetch.py
      # A push reuses the live numbers: only redo the Drive links (a minute, not a Meta pull)
      - name: Redo the Drive links
        if: github.event_name == 'push' && steps.reuse.outcome == 'success'
        continue-on-error: true
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          DRIVE_KEY: ${{ secrets.DRIVE_KEY }}
        run: python -u fetch.py --relink
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
