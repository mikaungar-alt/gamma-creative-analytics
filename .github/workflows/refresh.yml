name: Refresh data
on:
  schedule:
    - cron: "30 3 * * *"   # every night, 06:30 Israel time (05:30 in winter)
    - cron: "30 5 * * *"   # backup two hours later, in case GitHub skips the first
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==43.0.3
      - name: Pull Meta data and encrypt
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          DAYS: "90"
        run: python -u fetch.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
